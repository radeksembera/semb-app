<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pot Odds · Poker Tools</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="poker-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="poker-favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="poker-apple-touch-icon.png" />
<link rel="manifest" href="pot-odds-manifest.json" />
<meta name="theme-color" content="#4338ca" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pot Odds" />

<style>
  :root {
    --page-bg-1: #f7f8fa;
    --page-bg-2: #e8eaed;
    --panel-bg: #ffffff;
    --modal-bg: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #4338ca;
    --slot-empty: #e5e7eb;
    --slot-border: #c5cad2;
    --border: #d1d5db;
    --border-soft: rgba(0,0,0,0.08);
    --surface-soft: #f9fafb;
    --surface-soft-border: #e5e7eb;
    --cell-zero-bg: #eef0f2;
    --cell-zero-text: #b8bec7;
    --cell-excluded-bg: #d5dae1;
    --cell-excluded-text: #9aa3af;
    --shadow: rgba(0,0,0,0.35);
    --shadow-modal: rgba(0,0,0,0.4);
    --good: #16a34a;
    --bad: #dc2626;
    --seg-blinds: #94a3b8;
    --seg-pot: #64748b;
    --seg-villain: #f59e0b;
  }

  :root[data-theme="dark"] {
    --page-bg-1: #1b1e25;
    --page-bg-2: #05060a;
    --panel-bg: #1c1e24;
    --modal-bg: #22252c;
    --ink: #e8eaed;
    --muted: #9aa1ac;
    --accent: #818cf8;
    --slot-empty: #262a33;
    --slot-border: #3a3f4a;
    --border: #3a3f4a;
    --border-soft: rgba(255,255,255,0.08);
    --surface-soft: #22252c;
    --surface-soft-border: #2f333c;
    --cell-zero-bg: #22252c;
    --cell-zero-text: #4b515c;
    --cell-excluded-bg: #262a33;
    --cell-excluded-text: #565c68;
    --shadow: rgba(0,0,0,0.6);
    --shadow-modal: rgba(0,0,0,0.6);
    --good: #4ade80;
    --bad: #f87171;
    --seg-blinds: #475569;
    --seg-pot: #334155;
    --seg-villain: #b45309;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--page-bg-1), var(--page-bg-2));
    min-height: 100vh;
    color: var(--ink);
    padding: 24px 16px 60px;
    transition: background-color 0.2s ease;
  }

  .app {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 24px 28px 32px;
    box-shadow: 0 20px 50px var(--shadow);
    transition: background-color 0.2s ease;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
  }

  .theme-toggle {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--ink);
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tab {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--muted);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .tab:hover {
    color: var(--ink);
  }

  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 8px;
    line-height: 1.5;
  }

  .formula {
    font-size: 13px;
    color: var(--muted);
    background: var(--surface-soft);
    border: 1px solid var(--surface-soft-border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 24px;
  }

  .formula strong {
    color: var(--ink);
  }

  .po-inputs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .po-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .po-field label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .po-field input {
    font-size: 16px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--ink);
    width: 100%;
  }

  .po-field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .po-bar {
    display: flex;
    height: 40px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .po-bar > div {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.15s ease;
  }

  .seg-blinds { background: var(--seg-blinds); }
  .seg-pot { background: var(--seg-pot); }
  .seg-villain { background: var(--seg-villain); }
  .seg-my { background: var(--accent); }

  .po-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .po-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .po-result {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: stretch;
    margin-bottom: 24px;
  }

  .po-result-card {
    flex: 1;
    min-width: 200px;
    background: var(--surface-soft);
    border: 1px solid var(--surface-soft-border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
  }

  .po-result-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .po-result-value {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
  }

  .po-result-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .verdict-section {
    background: var(--surface-soft);
    border: 1px solid var(--surface-soft-border);
    border-radius: 12px;
    padding: 18px;
  }

  .verdict-section .po-field {
    max-width: 260px;
    margin-bottom: 14px;
  }

  .verdict {
    font-size: 16px;
    font-weight: 800;
    padding: 12px 14px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .verdict.good {
    background: color-mix(in srgb, var(--good) 16%, transparent);
    color: var(--good);
  }

  .verdict.bad {
    background: color-mix(in srgb, var(--bad) 16%, transparent);
    color: var(--bad);
  }

  .verdict-sub {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header-row">
    <h1>Pot Odds</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý režim">🌙</button>
  </div>

  <nav class="tabs">
    <a href="poker.html" class="tab">Blockers</a>
    <a href="headsup-allin.html" class="tab">Heads-up All-in</a>
    <a href="pot-odds.html" class="tab active">Pot Odds</a>
  </nav>

  <p class="subtitle">Kolik ti musí házet pot, aby byl call matematicky výhodný.</p>
  <div class="formula">Pot Odds = <strong>(blindy + pot + sázka soupeře + moje sázka)</strong> / <strong>moje sázka</strong></div>

  <div class="po-inputs">
    <div class="po-field">
      <label><span class="swatch seg-blinds"></span>Blindy</label>
      <input type="number" id="poBlinds" value="150" min="0" step="1" />
    </div>
    <div class="po-field">
      <label><span class="swatch seg-pot"></span>Pot (předchozí kola)</label>
      <input type="number" id="poPot" value="250" min="0" step="1" />
    </div>
    <div class="po-field">
      <label><span class="swatch seg-villain"></span>Sázka soupeře</label>
      <input type="number" id="poVillain" value="400" min="0" step="1" />
    </div>
    <div class="po-field">
      <label><span class="swatch seg-my"></span>Moje sázka (call)</label>
      <input type="number" id="poMyCall" value="400" min="0" step="1" />
    </div>
  </div>

  <div class="po-bar" id="poBar"></div>
  <div class="po-legend" id="poLegend"></div>

  <div class="po-result">
    <div class="po-result-card">
      <div class="po-result-label">Pot odds</div>
      <div class="po-result-value" id="poRatio">3.0 : 1</div>
      <div class="po-result-sub" id="poRatioSub">celkem v potu / moje sázka</div>
    </div>
    <div class="po-result-card">
      <div class="po-result-label">Potřebná equity</div>
      <div class="po-result-value" id="poEquity">33.3 %</div>
      <div class="po-result-sub">aby byl call na dlouhodobě +EV</div>
    </div>
  </div>

  <div class="verdict-section">
    <div class="po-field">
      <label>Moje odhadovaná equity (%)</label>
      <input type="number" id="poMyEquity" value="35" min="0" max="100" step="1" />
    </div>
    <div class="verdict" id="poVerdict"></div>
    <div class="verdict-sub" id="poVerdictSub"></div>
  </div>
</div>

<script>
(function () {
  const ids = ['poBlinds', 'poPot', 'poVillain', 'poMyCall', 'poMyEquity'];
  const els = {};
  ids.forEach(id => { els[id] = document.getElementById(id); });

  const bar = document.getElementById('poBar');
  const legend = document.getElementById('poLegend');
  const ratioEl = document.getElementById('poRatio');
  const ratioSubEl = document.getElementById('poRatioSub');
  const equityEl = document.getElementById('poEquity');
  const verdictEl = document.getElementById('poVerdict');
  const verdictSubEl = document.getElementById('poVerdictSub');

  const SEGMENTS = [
    { key: 'poBlinds', cls: 'seg-blinds', label: 'Blindy' },
    { key: 'poPot', cls: 'seg-pot', label: 'Pot' },
    { key: 'poVillain', cls: 'seg-villain', label: 'Sázka soupeře' },
    { key: 'poMyCall', cls: 'seg-my', label: 'Moje sázka' },
  ];

  function num(id) {
    const v = parseFloat(els[id].value);
    return isFinite(v) && v >= 0 ? v : 0;
  }

  function render() {
    const values = {};
    SEGMENTS.forEach(s => { values[s.key] = num(s.key); });
    const total = SEGMENTS.reduce((sum, s) => sum + values[s.key], 0);
    const myCall = values.poMyCall;

    bar.innerHTML = '';
    legend.innerHTML = '';
    SEGMENTS.forEach(s => {
      const pct = total > 0 ? (values[s.key] / total) * 100 : 25;
      const seg = document.createElement('div');
      seg.className = s.cls;
      seg.style.width = pct + '%';
      if (pct > 10) seg.textContent = Math.round(values[s.key]);
      bar.appendChild(seg);

      const item = document.createElement('span');
      item.innerHTML = `<span class="swatch ${s.cls}"></span>${s.label}: ${values[s.key]}`;
      legend.appendChild(item);
    });

    if (myCall > 0 && total > 0) {
      const ratio = total / myCall;
      ratioEl.textContent = ratio.toFixed(1) + ' : 1';
      ratioSubEl.textContent = `${total} / ${myCall}`;

      const neededEquity = (myCall / total) * 100;
      equityEl.textContent = neededEquity.toFixed(1) + ' %';

      const myEquity = num('poMyEquity');
      const isGood = myEquity >= neededEquity;
      verdictEl.className = 'verdict ' + (isGood ? 'good' : 'bad');
      verdictEl.innerHTML = isGood
        ? `✅ Call je +EV (máš ${myEquity}% vs potřebných ${neededEquity.toFixed(1)}%)`
        : `❌ Call je -EV (máš ${myEquity}% vs potřebných ${neededEquity.toFixed(1)}%)`;
      verdictSubEl.textContent = isGood
        ? 'Tvoje odhadovaná equity pokrývá pot odds — dlouhodobě je call ziskový.'
        : 'Tvoje odhadovaná equity je pod hranicí pot odds — dlouhodobě proděláváš.';
    } else {
      ratioEl.textContent = '–';
      ratioSubEl.textContent = 'zadej platnou sázku';
      equityEl.textContent = '–';
      verdictEl.className = 'verdict';
      verdictEl.textContent = '';
      verdictSubEl.textContent = '';
    }
  }

  ids.forEach(id => els[id].addEventListener('input', render));
  render();

  const THEME_KEY = 'pokerBlockersTheme';
  const themeToggleBtn = document.getElementById('themeToggle');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeToggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Přepnout na světlý režim' : 'Přepnout na tmavý režim');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function preferredTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === 'light' || saved === 'dark') return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  let currentTheme = preferredTheme();
  applyTheme(currentTheme);

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
  });
})();
</script>
</body>
</html>
