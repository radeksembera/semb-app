<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MTT Tracker · Poker Tools</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="poker-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="poker-favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="poker-apple-touch-icon.png" />
<link rel="manifest" href="mtt-tracker-manifest.json" />
<meta name="theme-color" content="#4338ca" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MTT Tracker" />

<style>
  :root {
    --page-bg-1: #f7f8fa;
    --page-bg-2: #e8eaed;
    --panel-bg: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #4338ca;
    --border: #d1d5db;
    --surface-soft: #f9fafb;
    --surface-soft-border: #e5e7eb;
    --shadow: rgba(0,0,0,0.35);
    --good: #16a34a;
    --bad: #dc2626;
    --good-bg: #dcfce7;
    --bad-bg: #fee2e2;
  }

  :root[data-theme="dark"] {
    --page-bg-1: #1b1e25;
    --page-bg-2: #05060a;
    --panel-bg: #1c1e24;
    --ink: #e8eaed;
    --muted: #9aa1ac;
    --accent: #818cf8;
    --border: #3a3f4a;
    --surface-soft: #22252c;
    --surface-soft-border: #2f333c;
    --shadow: rgba(0,0,0,0.6);
    --good: #4ade80;
    --bad: #f87171;
    --good-bg: #14532d;
    --bad-bg: #7f1d1d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--page-bg-1), var(--page-bg-2));
    min-height: 100vh;
    color: var(--ink);
    padding: 24px 16px 60px;
    transition: background-color 0.2s ease;
  }

  .app {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 24px 28px 32px;
    box-shadow: 0 20px 50px var(--shadow);
    transition: background-color 0.2s ease;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
  }

  .theme-toggle {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--ink);
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tab {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--muted);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .tab:hover {
    color: var(--ink);
  }

  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .section {
    background: var(--surface-soft);
    border: 1px solid var(--surface-soft-border);
    border-radius: 14px;
    padding: 18px;
  }

  .section-title {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }

  .action-btn {
    height: 96px;
    border-radius: 14px;
    border: 2px solid transparent;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.06s ease;
  }

  .action-btn:active {
    transform: scale(0.97);
  }

  .action-btn.fold {
    background: var(--bad-bg);
    color: var(--bad);
    border-color: var(--bad);
  }

  .action-btn.bet {
    background: var(--good-bg);
    color: var(--good);
    border-color: var(--good);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 26px;
    font-weight: 800;
  }

  .stat.vpip .stat-value {
    color: var(--accent);
  }

  .footer-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .small-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }

  .small-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header-row">
    <h1>MTT Tracker</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý režim">🌙</button>
  </div>

  <nav class="tabs">
    <a href="poker.html" class="tab">Blockers</a>
    <a href="headsup-allin.html" class="tab">Heads-up All-in</a>
    <a href="mtt-tracker.html" class="tab active">MTT Tracker</a>
  </nav>

  <section class="section">
    <h2 class="section-title">VPIP</h2>

    <div class="action-buttons">
      <button id="foldBtn" class="action-btn fold" type="button">FOLD</button>
      <button id="betBtn" class="action-btn bet" type="button">BET</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Handy</div>
        <div class="stat-value" id="statHands">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Foldy</div>
        <div class="stat-value" id="statFolds">0</div>
      </div>
      <div class="stat vpip">
        <div class="stat-label">VPIP</div>
        <div class="stat-value" id="statVpip">–</div>
      </div>
    </div>

    <div class="footer-actions">
      <button id="undoBtn" class="small-btn" type="button">Zpět</button>
      <button id="resetBtn" class="small-btn" type="button">Reset</button>
    </div>
  </section>
</div>

<script>
(function () {
  const STORAGE_KEY = 'mttTrackerVpip';

  // history of actions in order ('fold' | 'bet'), so Undo can step back
  let history = [];

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) history = saved.filter(a => a === 'fold' || a === 'bet');
  } catch (e) {}

  const handsEl = document.getElementById('statHands');
  const foldsEl = document.getElementById('statFolds');
  const vpipEl = document.getElementById('statVpip');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function render() {
    const hands = history.length;
    const folds = history.filter(a => a === 'fold').length;
    const bets = hands - folds;

    handsEl.textContent = hands;
    foldsEl.textContent = folds;
    vpipEl.textContent = hands > 0 ? ((bets / hands) * 100).toFixed(1) + ' %' : '–';

    undoBtn.disabled = hands === 0;
    resetBtn.disabled = hands === 0;
  }

  function record(action) {
    history.push(action);
    save();
    render();
  }

  document.getElementById('foldBtn').addEventListener('click', () => record('fold'));
  document.getElementById('betBtn').addEventListener('click', () => record('bet'));

  undoBtn.addEventListener('click', () => {
    history.pop();
    save();
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('Opravdu vynulovat statistiku?')) {
      history = [];
      save();
      render();
    }
  });

  render();

  const THEME_KEY = 'pokerBlockersTheme';
  const themeToggleBtn = document.getElementById('themeToggle');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeToggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Přepnout na světlý režim' : 'Přepnout na tmavý režim');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function preferredTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === 'light' || saved === 'dark') return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  let currentTheme = preferredTheme();
  applyTheme(currentTheme);

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
  });
})();
</script>
</body>
</html>
