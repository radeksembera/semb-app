<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heads-up All-in · Poker Tools</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="poker-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="poker-favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="poker-apple-touch-icon.png" />
<link rel="manifest" href="headsup-allin-manifest.json" />
<meta name="theme-color" content="#4338ca" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Heads-up All-in" />

<style>
  :root {
    --page-bg-1: #f7f8fa;
    --page-bg-2: #e8eaed;
    --panel-bg: #ffffff;
    --modal-bg: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #4338ca;
    --slot-empty: #e5e7eb;
    --slot-border: #c5cad2;
    --border: #d1d5db;
    --border-soft: rgba(0,0,0,0.08);
    --surface-soft: #f9fafb;
    --surface-soft-border: #e5e7eb;
    --cell-zero-bg: #eef0f2;
    --cell-zero-text: #b8bec7;
    --cell-excluded-bg: #d5dae1;
    --cell-excluded-text: #9aa3af;
    --shadow: rgba(0,0,0,0.35);
    --shadow-modal: rgba(0,0,0,0.4);
    --good: #16a34a;
    --bad: #dc2626;
  }

  :root[data-theme="dark"] {
    --page-bg-1: #1b1e25;
    --page-bg-2: #05060a;
    --panel-bg: #1c1e24;
    --modal-bg: #22252c;
    --ink: #e8eaed;
    --muted: #9aa1ac;
    --accent: #818cf8;
    --slot-empty: #262a33;
    --slot-border: #3a3f4a;
    --border: #3a3f4a;
    --border-soft: rgba(255,255,255,0.08);
    --surface-soft: #22252c;
    --surface-soft-border: #2f333c;
    --cell-zero-bg: #22252c;
    --cell-zero-text: #4b515c;
    --cell-excluded-bg: #262a33;
    --cell-excluded-text: #565c68;
    --shadow: rgba(0,0,0,0.6);
    --shadow-modal: rgba(0,0,0,0.6);
    --good: #4ade80;
    --bad: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--page-bg-1), var(--page-bg-2));
    min-height: 100vh;
    color: var(--ink);
    padding: 24px 16px 60px;
    transition: background-color 0.2s ease;
  }

  .app {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 24px 28px 32px;
    box-shadow: 0 20px 50px var(--shadow);
    transition: background-color 0.2s ease;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
  }

  .theme-toggle {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--ink);
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tab {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--muted);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .tab:hover {
    color: var(--ink);
  }

  .tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 12px;
  }

  .section-title:first-of-type {
    margin-top: 0;
  }

  .section-title .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .section-title.fav .dot { background: var(--good); }
  .section-title.dog .dot { background: var(--bad); }

  .matchup-row {
    margin-bottom: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--surface-soft);
    border: 1px solid var(--surface-soft-border);
  }

  .matchup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .matchup-hands {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hand-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  .vs-sep {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .matchup-pct {
    font-size: 16px;
    font-weight: 800;
  }

  .matchup-pct.fav { color: var(--good); }
  .matchup-pct.dog { color: var(--bad); }

  .equity-bar {
    display: flex;
    height: 16px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--cell-excluded-bg);
  }
</style>
</head>
<body>
<div class="app">
  <div class="header-row">
    <h1>Heads-up All-in</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý режim">🌙</button>
  </div>

  <nav class="tabs">
    <a href="poker.html" class="tab">Blockers</a>
    <a href="headsup-allin.html" class="tab active">Heads-up All-in</a>
  </nav>

  <p class="subtitle">Přibližná equity preflop all-in v headsupu. Nejdřív pohled favorita (zelená, řazeno od nejjistější výhry), pak stejné srážky z pohledu slabší ruky (červená, řazeno od nejmenšího handicapu).</p>

  <div id="sections"></div>
</div>

<script>
(function () {
  const MATCHUPS = [
    { handA: 'AA', handB: 'KK', pctA: 82, pctB: 18 },
    { handA: 'QQ', handB: '88', pctA: 81, pctB: 19 },
    { handA: 'KK', handB: '87s', pctA: 77, pctB: 23 },
    { handA: 'AK', handB: 'AQ', rangeA: [70, 75], rangeB: [25, 30] },
    { handA: 'QQ', handB: 'AJ', pctA: 67, pctB: 33 },
    { handA: 'AK', handB: 'QJ', pctA: 63, pctB: 37 },
    { handA: '88', handB: 'AK', pctA: 53, pctB: 47 },
  ];

  // normalize: every matchup gets a numeric pctA/pctB (midpoint for ranges) for
  // sorting and bar width, plus a display label (range or plain number).
  MATCHUPS.forEach(m => {
    if (m.rangeA) {
      m.pctA = (m.rangeA[0] + m.rangeA[1]) / 2;
      m.pctB = (m.rangeB[0] + m.rangeB[1]) / 2;
      m.labelA = `${m.rangeA[0]}–${m.rangeA[1]}%`;
      m.labelB = `${m.rangeB[0]}–${m.rangeB[1]}%`;
    } else {
      m.labelA = `${m.pctA}%`;
      m.labelB = `${m.pctB}%`;
    }
  });

  // pct assumed >= 50 for green, <= 50 for red; distance from 50 drives intensity
  function scaleColor(pct, kind) {
    const t = Math.min(1, Math.max(0, Math.abs(pct - 50) / 50));
    const light = 82 - t * 34;
    const sat = 48 + t * 24;
    const hue = kind === 'fav' ? 142 : 4;
    return `hsl(${hue}, ${sat}%, ${light}%)`;
  }

  function buildRow(m, kind) {
    const lead = kind === 'fav'
      ? { hand: m.handA, pct: m.pctA, label: m.labelA }
      : { hand: m.handB, pct: m.pctB, label: m.labelB };
    const rest = kind === 'fav' ? m.handB : m.handA;

    const row = document.createElement('div');
    row.className = 'matchup-row';

    const header = document.createElement('div');
    header.className = 'matchup-header';
    header.innerHTML =
      `<span class="matchup-hands">` +
        `<span class="hand-chip">${lead.hand}</span>` +
        `<span class="vs-sep">vs</span>` +
        `<span class="hand-chip">${rest}</span>` +
      `</span>` +
      `<span class="matchup-pct ${kind}">${lead.label}</span>`;
    row.appendChild(header);

    const bar = document.createElement('div');
    bar.className = 'equity-bar';
    const fill = document.createElement('div');
    fill.style.width = lead.pct + '%';
    fill.style.background = scaleColor(lead.pct, kind);
    bar.appendChild(fill);
    row.appendChild(bar);

    return row;
  }

  const sectionsEl = document.getElementById('sections');

  const favTitle = document.createElement('div');
  favTitle.className = 'section-title fav';
  favTitle.innerHTML = '<span class="dot"></span>Favorit (od nejjistější výhry)';
  sectionsEl.appendChild(favTitle);

  [...MATCHUPS].sort((a, b) => b.pctA - a.pctA)
    .forEach(m => sectionsEl.appendChild(buildRow(m, 'fav')));

  const dogTitle = document.createElement('div');
  dogTitle.className = 'section-title dog';
  dogTitle.innerHTML = '<span class="dot"></span>Outsider (od nejmenšího handicapu)';
  sectionsEl.appendChild(dogTitle);

  [...MATCHUPS].sort((a, b) => b.pctB - a.pctB)
    .forEach(m => sectionsEl.appendChild(buildRow(m, 'dog')));

  const THEME_KEY = 'pokerBlockersTheme';
  const themeToggleBtn = document.getElementById('themeToggle');

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeToggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Přepnout na světlý režim' : 'Přepnout na tmavý režim');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function preferredTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === 'light' || saved === 'dark') return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  let currentTheme = preferredTheme();
  applyTheme(currentTheme);

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
  });
})();
</script>
</body>
</html>
